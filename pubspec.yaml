name: emplake
description: Engenharia reversa do jogo Emplake — equações com dígitos e operadores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  intl: any
  curved_navigation_bar: ^1.0.6
  flutter_math_fork: ^0.7.3
  google_fonts: ^6.2.1
  loading_animation_widget: ^1.3.0
  audioplayers: ^6.4.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_ui_auth: ^1.16.1
  firebase_ui_localizations: ^1.14.1
  firebase_ui_oauth_google: ^1.4.1
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
